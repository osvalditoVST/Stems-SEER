name: Compilar StemSeer (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Probar el nucleo
        run: build\Release\stemseer_core_test.exe 128

      - name: Subir VST3 y Standalone
        uses: actions/upload-artifact@v4
        with:
          name: StemSeer-Windows
          if-no-files-found: error
          path: |
            build/StemSeer_artefacts/Release/VST3/StemSeer.vst3
            build/StemSeer_artefacts/Release/Standalone/StemSeer.exe
